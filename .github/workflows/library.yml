# The CI of a webcpp library, which its own .github/workflows/ci.yml calls:
#
#     jobs:
#       ci:
#         uses: webcpporg/webcpp/.github/workflows/library.yml@main
#         with:
#           library: <name>
#
# and of the superproject, whose ci.yml calls it without a library: then it builds every library
# of libs/ at the commit its submodule points to, and the index page with their pages.
#
# Every job checks out webcpporg/webcpp with its submodules, then, for a library, the library's
# commit into libs/<library> in place of its submodule; it runs from the superproject's root,
# with the b2 and the Boost 1.92.0 of tools/ci/actions/boost. Jobs:
#
#   plan        runs b2 declared-targets and writes the matrix of lanes (tools/ci/matrix.py):
#               a lane per compiler for each target the library declares. The CI never lists a
#               library's targets by hand, and a target without a lane fails the plan. It also
#               runs b2 declared-lanes and writes the matrix of own lanes, those a library
#               declares with webcpp.lane, such as its oracle's.
#   lanes       one job per lane, which runs the lane command, b2 -a --dump-tests
#               --out-xml=<lane>.xml for one toolset, and uploads the XML. With --out-xml, b2
#               exits 0 even when a test fails: the report gives the verdict.
#   own-lanes   one job per own lane, on Linux x86-64 with Node and Clang 18, which runs
#               b2 -a <directory>//<lane>; its exit status is the lane's verdict. A library that
#               declares none, as xactor, has no such job.
#   docs        the library's page, or every page and the index, with MrDocs on Linux x86-64;
#               the index is built with -sWEBCPP_INDEX=site, its links where the site serves
#               each page (libs/<name>/), and the pages are the artifact ci.yml publishes.
#   tools       for the superproject only: every tools/**/*_test.py, the tests of the build,
#               the oracle, the lint, the report, the documentation and the CI's own scripts.
#   lint        tools/lint/lint.sh in four shards, each analysing a quarter of the files with
#               clang-tidy and running every other rule; with the full history, which the
#               banned-word rule reads.
#   actionlint  every workflow of the superproject and of the libraries.
#   report      merges every lane's XML with tools/report/report.py into the test matrix. Its
#               exit status is the verdict, and it fails too when a lane's job failed or wrote
#               no XML, or when an own lane's job failed.
#
# No b2 call passes -j: b2 runs as many jobs as the runner has processors.
name: Library

on:
  workflow_call:
    inputs:
      library:
        description: The library of libs/ to build; empty for every library and the index.
        type: string
        required: false
        default: ''
    outputs:
      docs:
        description: Whether the docs job built the pages and uploaded them as the docs artifact.
        value: ${{ jobs.docs.outputs.built }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      own-lanes: ${{ steps.plan.outputs.own-lanes }}
      has-own-lanes: ${{ steps.plan.outputs.has-own-lanes }}
    steps:
      # The superproject is the caller's commit when it calls this workflow itself, and main
      # when a library does, the branch this workflow is called at.
      - &superproject
        name: Check out the superproject
        if: inputs.library == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - &superproject-for-library
        name: Check out the superproject
        if: inputs.library != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: webcpporg/webcpp
          ref: main
          submodules: recursive
      - &make-room
        name: Make room for the library
        if: inputs.library != ''
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          [[ "$LIBRARY" =~ ^[a-z][a-z0-9_]*$ ]] || { echo "not a library name: $LIBRARY"; exit 1; }
          rm -rf "libs/$LIBRARY"
      # The caller's repository at the commit of its event, a pull request's merge included.
      - &library
        name: Check out the library
        if: inputs.library != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: libs/${{ inputs.library }}

      - &boost
        uses: ./tools/ci/actions/boost

      - name: Plan the lanes
        id: plan
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          arguments=()
          if [ -n "$LIBRARY" ]; then
            arguments=(--library "$LIBRARY")
          fi
          matrix="$(python3 tools/ci/matrix.py plan "${arguments[@]}")"
          python3 -m json.tool <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          own_lanes="$(python3 tools/ci/matrix.py own-lanes "${arguments[@]}")"
          python3 -m json.tool <<< "$own_lanes"
          echo "own-lanes=$own_lanes" >> "$GITHUB_OUTPUT"
          # A matrix with no entry fails its job, so the own-lanes job runs only when there is one.
          if [ "$own_lanes" = '{"include":[]}' ]; then
            echo "has-own-lanes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-own-lanes=true" >> "$GITHUB_OUTPUT"
          fi

  lanes:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - *superproject
      - *superproject-for-library
      - *make-room
      - *library
      - *boost

      - if: matrix.wasm
        uses: ./tools/ci/actions/wasi-sdk

      - if: matrix.wasm
        uses: ./tools/ci/actions/wasmtime

      # The lane registers its toolset in .local/user-config.jam, prints its b2 command and runs
      # it; Windows's Python is python.
      - name: Lane
        id: lane
        env:
          LANE: ${{ toJSON(matrix) }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: '"$PYTHON" tools/ci/matrix.py lane "$LANE"'

      - name: Upload the lane's XML
        if: always() && steps.lane.outputs.xml != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-${{ matrix.id }}
          path: ${{ steps.lane.outputs.xml }}
          if-no-files-found: error
          retention-days: 7

  # A library's own lane, such as its oracle: it compiles nothing, but its targets inherit the
  # requirements of the library's test project, the library's target among them, and with it the
  # Jamroot's check of Boost, so the job has Boost and a toolset, Clang 18, as the docs job does;
  # and Node, whose npm cache the action keys on every oracle's lock file. The job is named by
  # its matrix entry: Own lane (xstate, oracle, libs/xstate/test/oracle).
  own-lanes:
    name: Own lane
    needs: plan
    if: needs.plan.outputs.has-own-lanes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.own-lanes) }}
    steps:
      - *superproject
      - *superproject-for-library
      - *make-room
      - *library
      - *boost

      - uses: ./tools/ci/actions/node

      - name: Own lane
        env:
          LANE: ${{ matrix.lane }}
          DIRECTORY: ${{ matrix.directory }}
        run: |
          python3 tools/ci/matrix.py register clang-18
          env -u CPATH -u CPLUS_INCLUDE_PATH -u C_INCLUDE_PATH \
            b2 --user-config=.local/user-config.jam -a toolset=clang-18 "$DIRECTORY//$LANE"

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      built: ${{ steps.built.outputs.built }}
    steps:
      - *superproject
      - *superproject-for-library
      - *make-room
      - *library
      - *boost

      - uses: ./tools/ci/actions/node

      - uses: ./tools/ci/actions/mrdocs

      # clang++ reads the headers for tools/doc/doc_comments.py; the Boost check compiles with
      # the same Clang. The index links each library's page where the site serves it.
      - name: Documentation
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          python3 tools/ci/matrix.py register clang-18
          request=(doc -sWEBCPP_INDEX=site)
          if [ -n "$LIBRARY" ]; then
            request=("libs/$LIBRARY/doc")
          fi
          env -u CPATH -u CPLUS_INCLUDE_PATH -u C_INCLUDE_PATH \
            b2 --user-config=.local/user-config.jam -a -sCLANG=/usr/bin/clang++-18 \
            toolset=clang-18 "${request[@]}"

      # The pages where b2 doc writes them, which tools/ci/assemble.py lays out as the site.
      - name: Upload the pages
        if: inputs.library == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: |
            doc/html
            libs/*/doc/html
          if-no-files-found: error
          retention-days: 7

      - name: Upload the page
        if: inputs.library != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ inputs.library }}
          path: libs/${{ inputs.library }}/doc/html
          if-no-files-found: error
          retention-days: 7

      - name: Built
        id: built
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The whole history, of the superproject and of every library: the banned-word rule reads
      # every commit, not only the tree.
      - name: Check out the superproject
        if: inputs.library == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Check out the superproject
        if: inputs.library != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: webcpporg/webcpp
          ref: main
          submodules: recursive
          fetch-depth: 0
      - *make-room
      - name: Check out the library
        if: inputs.library != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: libs/${{ inputs.library }}
          fetch-depth: 0
      - *boost

      - uses: ./tools/ci/actions/wasi-sdk

      - uses: ./tools/ci/actions/node

      # The compilation database is what b2 compiles with its default toolset, the first that
      # user-config.jam registers.
      - name: Lint
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          python3 tools/ci/matrix.py register clang-18
          tools/lint/lint.sh --clang-format .local/wasi-sdk/bin/clang-format \
            --clang-tidy .local/wasi-sdk/bin/clang-tidy --shard "$SHARD"

  tools:
    name: Tests of the tools
    if: inputs.library == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - *superproject
      - *boost

      - uses: ./tools/ci/actions/wasi-sdk

      - uses: ./tools/ci/actions/wasmtime

      - uses: ./tools/ci/actions/node

      - uses: ./tools/ci/actions/mrdocs

      # The toolsets the tests build with, Clang 18 the default, and the clang++ that
      # tools/doc/doc_comments.py finds on PATH. Every test runs, and each failure is named.
      - name: Tests of the tools
        run: |
          python3 tools/ci/matrix.py register clang-18 wasip2 wasip3
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /usr/bin/clang++-18 "$RUNNER_TEMP/bin/clang++"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          failed=()
          while IFS= read -r test; do
            echo "::group::$test"
            python3 "$test" || failed+=("$test")
            echo "::endgroup::"
          done < <(find tools -name '*_test.py' -not -path '*/node_modules/*' | sort)
          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *superproject
      - *superproject-for-library
      - *make-room
      - *library

      # actionlint runs shellcheck, which the image has, on every run: script.
      - name: actionlint 1.7.12
        env:
          ASSET: actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tools/ci/download.sh \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ASSET" \
            "$SHA256" "$RUNNER_TEMP/$ASSET"
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP" actionlint
          shopt -s nullglob
          "$RUNNER_TEMP/actionlint" -config-file .github/actionlint.yaml \
            .github/workflows/*.yml libs/*/.github/workflows/*.yml

  report:
    name: Report
    needs: [plan, lanes, own-lanes]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *superproject
      - *superproject-for-library
      - *make-room
      - *library

      - name: Download the lanes' XML
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lane-*
          path: bin/lanes

      - name: Report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python3 tools/ci/matrix.py report --plan "$MATRIX" --lanes bin/lanes --out bin/report

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: bin/report
          if-no-files-found: error
          retention-days: 7

      # A lane whose job failed after b2 wrote its XML, which the report may read as whole; and an
      # own lane, which writes no XML, whose job is its verdict: skipped only when the plan found
      # none.
      - name: Every lane's job succeeded
        if: always()
        env:
          LANES: ${{ needs.lanes.result }}
          OWN_LANES: ${{ needs.own-lanes.result }}
          HAS_OWN_LANES: ${{ needs.plan.outputs.has-own-lanes }}
        run: |
          status=0
          if [ "$LANES" != success ]; then
            echo "a lane's job did not succeed: $LANES"
            status=1
          fi
          expected=skipped
          if [ "$HAS_OWN_LANES" = true ]; then
            expected=success
          fi
          if [ "$OWN_LANES" != "$expected" ]; then
            echo "an own lane's job is $OWN_LANES, where $expected was expected"
            status=1
          fi
          exit "$status"
