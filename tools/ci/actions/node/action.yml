name: Node
description: >-
  Installs Node 26.7.0, the version webcpp is developed with, with npm's cache keyed on the
  lock files of tools/doc (Asciidoctor.js, highlight.js), tools/lint (Pyright) and every
  library's oracle (libs/<name>/test/oracle, the original it pins).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.7.0
        cache: npm
        cache-dependency-path: |
          tools/doc/package-lock.json
          tools/lint/package-lock.json
          libs/*/test/oracle/package-lock.json
