name: emsdk
description: >-
  Installs Emscripten 6.0.11 from emsdk in .local/emsdk, the emsdk at its pinned commit and every
  archive it installs checked against its SHA-256, cached with Emscripten's cache, its system
  libraries built, per version and runner; checks that emcc is 6.0.11, installs the node wrapper
  tools/ci/emsdk.jam names, and gives the later steps EM_CACHE, .local/emscripten-cache by its
  resolved path, warmed. On Linux and macOS.

runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      run: bash tools/ci/actions/emsdk/install.sh key

    - name: Restore emsdk
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .local/emsdk
          .local/emscripten-cache
        key: ${{ steps.key.outputs.key }}

    - name: Install Emscripten 6.0.11
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: bash tools/ci/actions/emsdk/install.sh install

    # Before the save, so that the cache saved is the one Emscripten has checked.
    - name: Configure Emscripten 6.0.11
      shell: bash
      run: bash tools/ci/actions/emsdk/install.sh configure

    # Into the cache that is saved, so that every job restores them built.
    - name: Build Emscripten's system libraries
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: bash tools/ci/actions/emsdk/install.sh libraries

    - name: Save emsdk
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .local/emsdk
          .local/emscripten-cache
        key: ${{ steps.key.outputs.key }}
