name: MrDocs
description: >-
  Installs MrDocs 2026.9.29 in .local/mrdocs, checked against its SHA-256, on Linux x86-64: it
  writes each library's API reference.

runs:
  using: composite
  steps:
    - name: Install MrDocs 2026.9.29
      shell: bash
      run: bash tools/ci/actions/mrdocs/install.sh
